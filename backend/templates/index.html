<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀 AI牌譜添削ツール - 入力</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 520px;
            box-sizing: border-box;
        }
        h1 { font-size: 20px; color: #2c3e50; margin-bottom: 25px; text-align: center; }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label { 
            display: block; 
            font-size: 13px; 
            color: #7f8c8d; 
            margin-bottom: 8px; 
            font-weight: bold; 
        }
        
        /* テキストエリアとセレクトボックス共通のスタイル */
        textarea, select, input[type="file"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        textarea:focus, select:focus {
            outline: none;
            border-color: #3498db;
        }

        .divider {
            text-align: center;
            margin: 15px 0;
            color: #b2bec3;
            font-size: 13px;
            position: relative;
        }
        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background-color: #dfe6e9;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .submit-btn:hover { background-color: #2980b9; }
        
        .error-message {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>麻雀 AI牌譜添削ツール</h1>
    
    <!-- ファイル送信を含むため enctype="multipart/form-data" を指定 -->
    <form id="analyzeForm" action="/analyze" method="POST" enctype="multipart/form-data" onsubmit="return validateForm()">
        
        <!-- 1. URL または JSON入力用のテキストエリア -->
        <div class="input-group">
            <label for="inputData">牌譜URL または JSONデータ</label>
            <textarea id="inputData" name="input_data" placeholder="https://... または JSONテキストをそのまま貼り付け"></textarea>
        </div>

        <div class="divider">または</div>

        <!-- 2. ファイルアップロード -->
        <div class="input-group">
            <label for="fileInput">JSONファイルを選択</label>
            <input type="file" id="fileInput" name="file" accept=".json">
        </div>

        <!-- 3. 自家（seat）の選択プルダウン -->
        <div class="input-group">
            <label for="seatSelect">自家（シート）の指定</label>
            <select id="seatSelect" name="seat">
                <option value="0">東家 (East)</option>
                <option value="1">南家 (South)</option>
                <option value="2">西家 (West)</option>
                <option value="3">北家 (North)</option>
            </select>
        </div>

        <div id="errorMsg" class="error-message"></div>
        
        <button type="submit" class="submit-btn">解析を開始する</button>
    </form>
</div>

<script>
    function validateForm() {
        const inputData = document.getElementById('inputData').value.trim();
        const fileInput = document.getElementById('fileInput').files.length;
        const errorMsg = document.getElementById('errorMsg');

        // いずれも入力されていない場合はエラー
        if (inputData === "" && fileInput === 0) {
            errorMsg.textContent = "URL、JSONテキスト、またはファイルのうちいずれかを入力・選択してください。";
            errorMsg.style.display = "block";
            return false;
        }

        errorMsg.style.display = "none";
        return true;
    }
</script>

</body>
</html>
